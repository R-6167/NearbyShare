[package]
name = "nearby-share"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline, peer-to-peer nearby file sharing core (platform-agnostic)"
readme = "../../README.md"

[lib]
name = "nearby_share"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Cryptography
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }

# UniFFI (bindings for Kotlin / Swift)
uniffi = { version = "0.28", optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"], optional = true }

[dev-dependencies]

[features]
default = ["ffi"]
# Enable UniFFI scaffolding and exported API
ffi = ["dep:uniffi"]
