[package]
name = "nearby-share"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline, peer-to-peer nearby file sharing core (platform-agnostic)"
readme = "../../README.md"

[lib]
name = "nearby_share"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Cryptography
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
blake3 = "=1.5.5"
hkdf = "0.12.4"
sha2 = "0.10.8"
rand = "0.8.5"
rand_core = "0.6.4"
zeroize = { version = "1.8", features = ["derive"] }

# Errors (FFI surface)
thiserror = "1.0"

# UniFFI (bindings for Kotlin / Swift)
uniffi = { version = "0.28.3", optional = true }

[build-dependencies]
uniffi = { version = "0.28.3", features = ["build"], optional = true }

[dev-dependencies]

[features]
default = ["ffi"]
ffi = ["dep:uniffi"]
