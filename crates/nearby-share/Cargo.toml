[package]
name = "nearby-share"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline, peer-to-peer nearby file sharing core (platform-agnostic)"
readme = "../../README.md"

[lib]
name = "nearby_share"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Cryptography
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }

# Serialization / protocol (later)
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
# bytes = "1"

# Async runtime (if needed later)
# tokio = { version = "1", features = ["rt", "sync", "macros"] }

# UniFFI (enable when generating bindings)
# uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]

[features]
default = []
# uniffi = ["dep:uniffi"]
