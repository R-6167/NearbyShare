name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  NDK_VERSION: "27.2.12479018"
  CMDLINE_TOOLS_VERSION: "11076708"

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --all-features

  apk:
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept licenses and install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Build native libraries (all ABIs)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/$NDK_VERSION}"
          test -d "$ANDROID_NDK_HOME"
          chmod +x scripts/*.sh
          ROOT="$PWD"
          # Physical module dir (Gradle project :warpair-core)
          JNI_DIR="$ROOT/android/nearbyshare/src/main/jniLibs"
          mkdir -p "$JNI_DIR"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o "$JNI_DIR" \
            build -p nearby-share --release
          find "$JNI_DIR" -name "*.so" -type f

      - name: Bootstrap Gradle wrapper
        run: |
          chmod +x scripts/bootstrap-gradle-wrapper.sh
          ./scripts/bootstrap-gradle-wrapper.sh

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload WarPair APK
        uses: actions/upload-artifact@v4
        with:
          name: WarPair-debug
          path: |
            android/app/build/outputs/apk/debug/WarPair-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload jniLibs (debug)
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/nearbyshare/src/main/jniLibs/
          if-no-files-found: warn
