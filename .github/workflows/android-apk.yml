name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --all-features

  apk:
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Build native libraries (all ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/27.2.12479018}"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
            export ANDROID_NDK_HOME
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          chmod +x scripts/*.sh
          # jniLibs only – UniFFI generate is optional for smoke (C ABI)
          ROOT="$PWD"
          JNI_DIR="$ROOT/android/nearbyshare/src/main/jniLibs"
          mkdir -p "$JNI_DIR"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o "$JNI_DIR" \
            build -p nearby-share --release
          echo "jniLibs:"; find "$JNI_DIR" -name "*.so" -type f

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NearbyShare-demo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload jniLibs (debug)
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/nearbyshare/src/main/jniLibs/
          if-no-files-found: warn
